name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  workflow_dispatch:

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          lint: true
          type-checking: true

  # Lint and type-check the admin GUI, which is a separate npm project
  check-and-lint-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src-admin/package-lock.json
      - run: npm ci
        working-directory: src-admin
      - run: npm run lint
        working-directory: src-admin
      - run: npm run tsc
        working-directory: src-admin

  # Build the adapter (build/) and the Admin UI (admin/) in CI. Generated files are not committed to feature branches.
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Validate release tag and package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run check:release
      - run: npm run build
      - name: Verify the generated adapter and Admin UI
        run: |
          test -f build/main.js
          test -f admin/index_m.html
          test -f admin/tab_m.html
          test -d admin/assets
          grep -q 'lib/js/socket.io.js' admin/index_m.html

  # Runs Linux tests on pushes/PRs/manual runs and all supported OSes on release tag pushes
  adapter-tests:
    needs: [check-and-lint, check-and-lint-gui, build-and-check]

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        release:
          - ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        exclude:
          - os: windows-latest
            release: false
          - os: macos-latest
            release: false

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

  # Keep the compiled adapter and the generated Admin UI on main so installations from GitHub work.
  persist-admin-build:
    needs: [check-and-lint, check-and-lint-gui, build-and-check, adapter-tests]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated adapter and Admin UI to main
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$(git rev-parse HEAD)" != "$remote_main" ]; then
            echo "main moved; a newer workflow run will publish its build."
            exit 0
          fi
          # Both output directories are intentionally tracked for installations from GitHub.
          git add -A -- build admin ':(exclude)*.map'
          if git diff --cached --quiet; then
            echo "Admin build is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update admin build"
          git push origin HEAD:main

  # Publish only after the tagged commit passes all checks.
  deploy:
    needs: [check-and-lint, check-and-lint-gui, build-and-check, adapter-tests]

    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          build: true
          build-command: npm run check:release && npm run build
          github-token: ${{ secrets.GITHUB_TOKEN }}
